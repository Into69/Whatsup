<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Settings</title>
    <!-- The settings screen, as SettingsActivity's on Android: sections of cards, built by settings.js. -->
    <style>
        :root {
            --surface: #12151c; --card: #1a1e27; --stroke: #262b36; --accent: #4fc3f7; --secondary: #a0a8b8;
        }
        html, body { margin: 0; background: var(--surface); color: #fff; height: 100%; }
        body { font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
        button, input { font: inherit; color: inherit; }
        header {
            flex: none; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
            border-bottom: 1px solid var(--stroke);
        }
        header h1 { margin: 0; font-size: 20px; font-weight: 600; }
        #back {
            width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #back:hover { background: rgba(255, 255, 255, .08); }
        main { flex: 1; overflow-y: auto; }
        #content { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; }

        .section {
            display: flex; align-items: center; gap: 10px; margin: 24px 0 10px; padding: 0 4px;
            color: var(--accent); font-size: 13px; font-weight: bold; letter-spacing: .08em; text-transform: uppercase;
        }
        .section .icon { width: 18px; height: 18px; background: var(--accent); }
        .icon { -webkit-mask: center/contain no-repeat; mask: center/contain no-repeat; }
        .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; overflow: hidden; }
        .card + .card { margin-top: 10px; }
        .divider { height: 1px; background: var(--stroke); margin-left: 16px; }

        .row {
            display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box;
            padding: 12px 16px; cursor: pointer; user-select: none;
        }
        .row:hover { background: rgba(255, 255, 255, .04); }
        .row-text { flex: 1; min-width: 0; }
        .row-title { font-size: 15px; }
        .row-subtitle { margin-top: 2px; color: var(--secondary); font-size: 13px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
        .dots { display: flex; gap: 3px; flex: none; }
        .dots .dot { width: 8px; height: 8px; }

        /* A switch, as Android's. */
        .switch { position: relative; flex: none; width: 40px; height: 22px; }
        .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
        .switch span { position: absolute; inset: 0; border-radius: 11px; background: #3a4150; transition: background .15s; pointer-events: none; }
        .switch span::after {
            content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%;
            background: #c8cdd6; transition: transform .15s, background .15s;
        }
        .switch input:checked + span { background: rgba(79, 195, 247, .5); }
        .switch input:checked + span::after { transform: translateX(18px); background: var(--accent); }
        .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

        .category-title { font-weight: bold; font-size: 15px; }
        .all {
            flex: none; border: 0; background: transparent; color: var(--accent); font-weight: bold;
            padding: 8px 12px; border-radius: 20px; cursor: pointer;
        }
        .all:hover { background: rgba(79, 195, 247, .12); }
        .chevron { width: 24px; height: 24px; flex: none; background: var(--secondary); transition: transform .2s; }
        .open .chevron { transform: rotate(180deg); }

        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .tile {
            background: var(--card); border: 1px solid var(--stroke); border-radius: 14px; padding: 6px;
            cursor: pointer; text-align: left;
            display: flex; flex-direction: column; justify-content: flex-start;
        }
        .tile:hover { border-color: #3a4150; }
        .tile.selected { border: 2px solid var(--accent); padding: 5px; }
        .tile img, .tile .preview { display: block; width: 100%; height: 92px; object-fit: cover; border-radius: 10px; background: #0b0e14; }
        .tile b { display: block; margin-top: 8px; padding: 0 4px; font-size: 15px; }
        .tile small { display: block; padding: 0 4px 4px; color: var(--secondary); font-size: 12px; }

        .field { display: flex; gap: 8px; align-items: center; padding: 10px 12px 4px 16px; }
        .field input[type=text] {
            flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px;
            background: #0f1218; border: 1px solid var(--stroke); outline: none;
        }
        .field input[type=text]:focus { border-color: var(--accent); }
        .field button {
            padding: 8px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #05070d;
            font-weight: 600; cursor: pointer;
        }
        .note { padding: 4px 16px 14px; color: var(--secondary); font-size: 13px; white-space: pre-line; user-select: text; }
        .label { padding: 12px 16px 0; font-size: 15px; }
        input[type=range] { display: block; width: calc(100% - 32px); margin: 10px 16px; accent-color: var(--accent); }
        .about { padding: 14px 16px; color: var(--secondary); font-size: 13px; white-space: pre-line; user-select: text; }

        /* Red night mode, as on the globe page (desktop.css). */
        html.night body { filter: grayscale(1); }
        html.night::after {
            content: ""; position: fixed; inset: 0; z-index: 2147483647; pointer-events: none;
            background: #f00; mix-blend-mode: multiply;
        }
    </style>
</head>
<body>
    <header>
        <button id="back" title="Back (Esc)"><span class="icon" style="width:24px;height:24px;background:#fff;-webkit-mask-image:url(/icons/ic_arrow_back.svg);mask-image:url(/icons/ic_arrow_back.svg)"></span></button>
        <h1 id="title">Settings</h1>
    </header>
    <main><div id="content"></div></main>
    <script src="settings.js"></script>
</body>
</html>
